name: Build WatchWheel

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and package
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: WatchWheel-release
          path: |
            artifacts/WatchWheel-*.zip
            artifacts/WatchWheel-*.zip.sha256
          if-no-files-found: error
